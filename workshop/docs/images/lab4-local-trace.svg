  <title id="title">Lab 4: local span tree with model and tool calls</title>
  <desc id="desc">Illustrative trace 4bf92f3577b34da6a3ce929d0e0e4736. A care_agent.turn lasting 9412.3 milliseconds contains invoke_agent, two chat calls and three tool calls. Model spans include token usage.</desc>
