    <text x="925" y="45" text-anchor="middle" fill="#fff" font-size="14">ILLUSTRATION / NOT A LIVE RUN</text>
    <text x="40" y="104" fill="#fff" font-size="30" font-weight="700">One turn, with its model and tool evidence.</text>
